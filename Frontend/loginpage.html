<html>
    <head>
        <title>Login</title>
        <link rel="stylesheet" href="login_page.css">
    </head>
    <body>
        <div class="form">
            <div class="cont">
              <h1 class="head">Welcome Back</h1>
            <p>Login to continue into your account</p>

       <!-- email/phone input -->
            <div class="email">
                <p>Email</p>
                <input class="emai" type="text" placeholder="abc@gmail.com">
            </div>

             <!-- password input -->
            <div class="pass">
                 <p>Password</p>
                 <input class="pass" type="password" placeholder="Enter your password">
                 
            </div>

             <!-- options-->
              <div class="options">
                 
                <input  type="checkbox"> <span>Remeber me</span>
                <a class="forgot" href="forgot_pass.html">Forgot Password</a>
              </div>



               <!-- Login button-->
              <button  class="logBut">Log in</button>

              <div class="divider">
                <span>
                </span>
                <p>or continue with</p>
                <span></span>
              </div>
              
                <!-- other login options-->

                <div class="other">
                        <div>
                      <button class="google"><img class="goog" src="photos/google.png" alt="">Google</button>
                    </div>
                <div>
                       <button class="apple"><img class="app" src="photos/apple.png" alt="">Apple</button>
                </div>

                </div>
                
                <div class="end">
                   
                   <p>Dont have an account ? <a class="sig" href="signup.html">Sign up</a></p>

                </div>
                
                
            </div>
            

        </div>
    </body>
</html>
