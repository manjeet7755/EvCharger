<html>
    <head>
        <title>Sign up</title>
        <link rel="stylesheet" href="signup.css">
    </head>
    <body>
        <div class="form">
           <div class="one">
             
             <div class="headd">
            <h1 class="head">
                Sign up
            </h1>
            <p>Sign up  to create account </p>
           </div>
           
           
           <div class="cred">
            <input class="first" type="text" placeholder="First name">
            <input class="second" type="text" placeholder="Last name">
           </div>
           
           
           <div>
               <p class="e">Email</p>
               <input class="mail" type="text" placeholder="abc@gmail.com">

           </div>
              

           <div>
            <p class="p">Password</p>
            <input class="pass" type="password" >

           </div>
            
           <button class="sign">Sign in </button>    
            
           <div class="divider">
                <span>
                </span>
                <p>or continue with</p>
                <span></span>
              </div>


           <div class="google">
            <button class="googbtn"><img class="goog" src="photos/google.png" alt="">Google</button>
           </div>

           <div class="apple">
            <button class="appbtn"><img class="app" src="photos/apple.png" alt="">Apple</button>
           </div>
          <div class="end">
            <p>Already have an account? <a class="login" href="loginpage.html">Login</a></p>
          </div>
           </div>
           
           
        </div>
    </body>
</html>
